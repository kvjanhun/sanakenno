name: CI — Web & Server

on:
  push:
    branches: [main]
    paths-ignore:
      - 'packages/mobile/**'
      - 'patches/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'packages/mobile/**'
      - 'patches/**'

# Superseded PR runs are cancelled; pushes to main queue instead, so deploys
# never overlap and every pushed commit either deploys or is superseded by a
# newer one — never half-raced on the server.
concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck server
        run: pnpm run typecheck

      - name: Typecheck packages
        run: pnpm turbo run typecheck --filter=!@sanakenno/mobile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:unit

      - name: BDD tests
        run: pnpm run test:bdd

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm exec playwright test

      - name: Build
        run: pnpm run build

      - name: Built PWA tests
        run: pnpm run test:pwa:built

  deploy:
    runs-on: ubuntu-latest
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Trigger deploy webhook
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://erez.ac/hooks/deploy-sanakenno?token=${{ secrets.DEPLOY_TOKEN }}" \
            | grep -q "^200$"

      # The webhook returns 200 for "accepted", not "deployed" — the deploy
      # runs asynchronously on the server. Poll until the live site serves
      # this exact commit (stamped into dist/commit.txt at image build) so
      # this job is only green when the deploy verifiably landed. Compare
      # content, not status: the SPA fallback answers 200 for missing files.
      - name: Verify deploy landed
        run: |
          echo "Waiting for sanakenno.fi to serve commit ${GITHUB_SHA}..."
          for i in $(seq 1 120); do
            live=$(curl -fsS --max-time 10 https://sanakenno.fi/commit.txt 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live commit matches after ~$((i * 5))s."
              curl -fsS --max-time 10 https://sanakenno.fi/api/health
              exit 0
            fi
            sleep 5
          done
          echo "Timed out: live commit is '${live:-<none>}', expected '${GITHUB_SHA}'."
          echo "The server-side deploy failed or is stalled — check the Telegram alert."
          exit 1
